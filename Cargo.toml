# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-contract-yaml"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-contract-yaml"
description = "YAML content contract: well-formed always, holding the keys and types a layout names when a Location binds one. A xmip-core-contract technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }

# The one real parser. Well-formedness is a genuine parse, and a scan error
# carries the line and column of where it stopped.
yaml-rust2 = "0.10"

[dev-dependencies]
# The parent's Stream fixture, for the tests only (ADR-0044).
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main", features = ["test-support"] }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
